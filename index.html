<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetAI COO Dashboard v5</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f2;--card:#fff;--border:rgba(0,0,0,0.09);--border-em:rgba(0,0,0,0.18);
  --text:#1a1a18;--muted:#6b6b66;--hint:#9e9e99;
  --info-bg:#e6f1fb;--info-t:#0c447c;--info-b:#b5d4f4;
  --ok-bg:#eaf3de;--ok-t:#27500a;--ok-b:#c0dd97;
  --warn-bg:#faeeda;--warn-t:#633806;--warn-b:#fac775;
  --err-bg:#fcebeb;--err-t:#791f1f;--err-b:#f7c1c1;
  --purple-bg:#eeedfe;--purple-t:#3c3489;--purple-b:#cecbf6;
  --nav-w:160px;--r:10px;--r-sm:6px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;font-size:14px}
nav{width:var(--nav-w);min-height:100vh;background:var(--card);border-right:0.5px solid var(--border);padding:20px 0;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh}
.nav-logo{padding:0 14px 16px;font-size:15px;font-weight:500;border-bottom:0.5px solid var(--border);margin-bottom:8px}
.nav-logo span{font-size:11px;font-weight:400;color:var(--muted);display:block;margin-top:2px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:13px;color:var(--muted);cursor:pointer;border-left:2px solid transparent}
.nav-item:hover{background:var(--bg);color:var(--text)}
.nav-item.active{color:var(--text);font-weight:500;border-left-color:var(--text);background:var(--bg)}
.nav-section{padding:14px 14px 4px;font-size:11px;color:var(--hint)}
main{flex:1;padding:28px 32px;max-width:960px}
.page{display:none}.page.active{display:block}
.page-title{font-size:20px;font-weight:500;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);margin-bottom:24px}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:16px 20px;margin-bottom:16px}
.card-title{font-size:13px;font-weight:500;margin-bottom:12px}
.ai-block{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:14px 16px;font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:16px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px}
.stat-label{font-size:11px;color:var(--muted);margin-bottom:3px}
.stat-val{font-size:22px;font-weight:500}
.stat-val.ok{color:var(--ok-t)}.stat-val.warn{color:var(--warn-t)}.stat-val.err{color:var(--err-t)}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;border:0.5px solid;white-space:nowrap}
.badge-ok{background:var(--ok-bg);color:var(--ok-t);border-color:var(--ok-b)}
.badge-warn{background:var(--warn-bg);color:var(--warn-t);border-color:var(--warn-b)}
.badge-err{background:var(--err-bg);color:var(--err-t);border-color:var(--err-b)}
.badge-info{background:var(--info-bg);color:var(--info-t);border-color:var(--info-b)}
.badge-purple{background:var(--purple-bg);color:var(--purple-t);border-color:var(--purple-b)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:0.5px solid var(--border)}
td{padding:9px 10px;border-bottom:0.5px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.risk-item{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.risk-item:last-child{border-bottom:none}
.risk-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0}
.risk-dot.high{background:#e24b4a}.risk-dot.mid{background:#ef9f27}.risk-dot.low{background:#639922}
.ind{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;border:0.5px solid}
.ind-ahead{background:var(--info-bg);color:var(--info-t);border-color:var(--info-b)}
.ind-on{background:var(--ok-bg);color:var(--ok-t);border-color:var(--ok-b)}
.ind-behind{background:var(--err-bg);color:var(--err-t);border-color:var(--err-b)}
.prog-wrap{background:var(--bg);border-radius:3px;height:5px;overflow:hidden;flex:1;min-width:60px}
.prog-fill{height:100%;border-radius:3px}
.prog-fill.ok{background:#639922}.prog-fill.warn{background:#ef9f27}.prog-fill.err{background:#e24b4a}
.sug-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.week-btn{font-size:12px;padding:4px 12px;border-radius:20px;border:0.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer}
.week-btn.active{background:var(--text);color:var(--card);border-color:transparent}
.week-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.raw-card{background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.raw-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.raw-header:hover{background:var(--bg)}
.raw-body{padding:14px 16px;border-top:0.5px solid var(--border);font-size:13px;line-height:1.7;white-space:pre-wrap;display:none;font-family:monospace;background:var(--bg)}
.raw-body.open{display:block}
.override-sel{font-size:11px;border:0.5px solid var(--border);border-radius:var(--r-sm);padding:2px 6px;background:var(--card);color:var(--text)}
</style>
</head>
<body>
<nav>
  <div class="nav-logo">MetAI COO<span>Dashboard v5</span></div>
  <div class="nav-section">總覽</div>
  <div class="nav-item active" onclick="showPage('overview')">◈ 首頁</div>
  <div class="nav-item" onclick="showPage('suggestions')">◎ 本週建議</div>
  <div class="nav-section">專案 &amp; 人力</div>
  <div class="nav-item" onclick="showPage('projects')">▲ 專案 / 產品</div>
  <div class="nav-item" onclick="showPage('rawreports')">▣ 原始週報</div>
  <div class="nav-section">商業</div>
  <div class="nav-item" onclick="showPage('bd')">◆ BD 商機</div>
</nav>
<main>

<div class="page active" id="page-overview">
  <div class="page-title">本週總覽</div>
  <div class="page-sub" id="ov-week-label">載入中…</div>
  <div class="ai-block" id="ov-ai-summary">AI 分析載入中…</div>
  <div class="card">
    <div class="card-title">專案 / 產品本週摘要</div>
    <table><thead><tr><th>專案</th><th>指標</th><th>本週摘要</th><th>進度</th></tr></thead>
    <tbody id="ov-proj-body"></tbody></table>
  </div>
  <div class="two-col">
    <div class="card"><div class="card-title">⚠ 本週風險</div><div id="ov-risks"></div></div>
    <div class="card"><div class="card-title">★ 本週亮點</div><div id="ov-highlights"></div></div>
  </div>
  <div class="card">
    <div class="card-title">本週繳交狀況</div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-label">已繳交</div><div class="stat-val ok" id="s-submitted">—</div></div>
      <div class="stat-card"><div class="stat-label">延遲繳交</div><div class="stat-val warn" id="s-late">—</div></div>
      <div class="stat-card"><div class="stat-label">未繳交</div><div class="stat-val err" id="s-missing">—</div></div>
      <div class="stat-card"><div class="stat-label">豁免 / 例外</div><div class="stat-val" id="s-exempt">—</div></div>
    </div>
    <div id="ov-missing"></div>
  </div>
</div>

<div class="page" id="page-suggestions">
  <div class="page-title">本週建議</div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div class="page-sub" style="margin-bottom:0">AI 自動生成行動建議</div>
    <div style="display:flex;gap:6px">
      <div class="week-btn active" id="sort-priority" onclick="setSugSort('priority')">↓ 優先級</div>
      <div class="week-btn" id="sort-original" onclick="setSugSort('original')">AI 原序</div>
    </div>
  </div>
  <div class="ai-block" id="sug-summary">載入中…</div>
  <div class="week-bar" id="sug-week-bar"></div>
  <div id="sug-list"></div>
</div>

<div class="page" id="page-projects">
  <div class="page-title">專案 / 產品</div>
  <div class="page-sub">本週各專案狀態</div>
  <div id="proj-cards"></div>
</div>

<div class="page" id="page-bd">
  <div class="page-title">BD 商機</div>
  <div class="ai-block" id="bd-ai">載入中…</div>
  <div class="week-bar">
    <div class="week-btn active" onclick="setBDTab('icp1')" id="bdtab-icp1">ICP 1</div>
    <div class="week-btn" onclick="setBDTab('icp2')" id="bdtab-icp2">ICP 2</div>
    <div class="week-btn" onclick="setBDTab('detected')" id="bdtab-detected">週報偵測</div>
  </div>
  <div id="bd-icp1-panel"><div id="bd-icp1-list"></div></div>
  <div id="bd-icp2-panel" style="display:none"><div id="bd-icp2-list"></div></div>
  <div id="bd-detected-panel" style="display:none"><div id="bd-detected-list"></div></div>
</div>

<div class="page" id="page-rawreports">
  <div class="page-title">原始週報查閱</div>
  <input type="text" id="raw-search" placeholder="搜尋人名…" oninput="filterRaw()" style="padding:7px 12px;border:0.5px solid var(--border);border-radius:var(--r-sm);background:var(--card);color:var(--text);font-size:13px;width:100%;margin-bottom:14px">
  <div id="raw-list"></div>
</div>

</main>
<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYH2iIKCfdblLCxbuRwn2AlY1A6MdhmQHJKcPKQx-gdoGwa196rcAPxMB7LPXojXET2Q/exec';
var D = {};
var curSugWeek = '';
var curSugSort = 'priority';
var curBDTab = 'icp1';
var allRaw = [];

function showPage(p) {
  document.querySelectorAll('.page').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.nav-item').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('page-' + p).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(el) {
    if (el.getAttribute('onclick') && el.getAttribute('onclick').indexOf("'" + p + "'") >= 0) el.classList.add('active');
  });
  if (p === 'suggestions') renderSuggestions();
  if (p === 'projects') renderProjects();
  if (p === 'bd') renderBD();
  if (p === 'rawreports') renderRaw();
}

function ind(v) {
  if (v === 'ahead') return '<span class="ind ind-ahead">↑ 超前</span>';
  if (v === 'behind') return '<span class="ind ind-behind">↓ 落後</span>';
  return '<span class="ind ind-on">→ 符合</span>';
}

function priDot(p) {
  var c = {high:'#e24b4a', mid:'#ef9f27', low:'#639922'};
  return '<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:' + (c[p]||c.low) + ';margin-right:6px;vertical-align:middle"></span>';
}

function renderOverview() {
  var ov = D.overview || {};
  document.getElementById('ov-week-label').textContent = ov.weekLabel || '—';
  document.getElementById('ov-ai-summary').textContent = ov.aiSummary || '（本週無 AI 摘要）';
  document.getElementById('s-submitted').textContent = ov.submitted !== undefined ? ov.submitted : '—';
  document.getElementById('s-late').textContent = ov.late !== undefined ? ov.late : '—';
  document.getElementById('s-missing').textContent = ov.missing !== undefined ? ov.missing : '—';
  document.getElementById('s-exempt').textContent = ov.exempt !== undefined ? ov.exempt : '—';

  var projects = ov.projects || [];
  document.getElementById('ov-proj-body').innerHTML = projects.map(function(p) {
    var eff = p.aiOverride || p.indicator || 'on';
    var prog = Number(p.progress) || 0;
    var pc = prog < 30 ? 'err' : prog < 70 ? 'warn' : 'ok';
    return '<tr><td style="font-weight:500">' + p.name + '</td><td>' + ind(eff) + '</td><td style="color:var(--muted)">' + (p.summary || '') + '</td><td><div style="display:flex;align-items:center;gap:6px"><div class="prog-wrap"><div class="prog-fill ' + pc + '" style="width:' + prog + '%"></div></div><span style="font-size:12px">' + prog + '%</span></div></td></tr>';
  }).join('');

  var risks = ov.risks || [];
  document.getElementById('ov-risks').innerHTML = risks.length ? risks.map(function(r) {
    return '<div class="risk-item"><div class="risk-dot ' + r.level + '"></div><span>' + r.text + '</span></div>';
  }).join('') : '<div style="font-size:13px;color:var(--muted)">本週無風險</div>';

  var highlights = ov.highlights || [];
  document.getElementById('ov-highlights').innerHTML = highlights.length ? highlights.map(function(h) {
    return '<div class="risk-item"><div class="risk-dot low"></div><span>' + h.text + '</span></div>';
  }).join('') : '<div style="font-size:13px;color:var(--muted)">本週無亮點</div>';

  var missing = ov.missingMembers || [];
  document.getElementById('ov-missing').innerHTML = missing.length ? '<div style="font-size:12px;color:var(--muted);margin-bottom:6px">未繳交：</div>' + missing.map(function(m) {
    return '<span style="display:inline-block;margin:3px 6px 3px 0;padding:4px 12px;border-radius:20px;background:var(--err-bg);border:0.5px solid var(--err-b);font-size:13px;color:var(--err-t)">' + m + '</span>';
  }).join('') : '<span style="font-size:13px;color:var(--ok-t)">全員繳交</span>';
}

function renderSuggestions() {
  var sug = D.suggestions || {};
  document.getElementById('sug-summary').textContent = sug.summary || '';
  var weeks = sug.weeks || [];
  if (!curSugWeek && weeks.length) curSugWeek = weeks[0];
  document.getElementById('sug-week-bar').innerHTML = weeks.map(function(w) {
    return '<div class="week-btn ' + (w === curSugWeek ? 'active' : '') + '" onclick="setSugWeek(\'' + w + '\')">' + w + '</div>';
  }).join('');
  renderSugList();
}

function setSugSort(s) {
  curSugSort = s;
  document.getElementById('sort-priority').classList.toggle('active', s === 'priority');
  document.getElementById('sort-original').classList.toggle('active', s === 'original');
  renderSugList();
}

function setSugWeek(w) {
  curSugWeek = w;
  document.querySelectorAll('#sug-week-bar .week-btn').forEach(function(b) { b.classList.toggle('active', b.textContent === w); });
  renderSugList();
}

function renderSugList() {
  var priOrder = {high:0, mid:1, low:2};
  var sug = D.suggestions || {};
  var items = (sug.items || []).filter(function(i) { return i.week === curSugWeek; });
  if (curSugSort === 'priority') items = items.slice().sort(function(a,b) { return (priOrder[a.priority]||9)-(priOrder[b.priority]||9); });
  var el = document.getElementById('sug-list');
  if (!items.length) { el.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:16px 0">本週無建議</div>'; return; }
  var catColors = {'人力':'var(--err-bg)','BD':'var(--info-bg)','人員關懷':'var(--purple-bg)','專案':'var(--warn-bg)','技術':'var(--ok-bg)','流程':'var(--ok-bg)'};
  var catText = {'人力':'var(--err-t)','BD':'var(--info-t)','人員關懷':'var(--purple-t)','專案':'var(--warn-t)','技術':'var(--ok-t)','流程':'var(--ok-t)'};
  el.innerHTML = items.map(function(s) {
    var priLabel = s.priority === 'high' ? '高優先' : s.priority === 'mid' ? '中優先' : '低優先';
    return '<div class="sug-card"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px"><div style="display:flex;align-items:flex-start;gap:8px">' + priDot(s.priority) + '<div><div style="font-weight:500;font-size:14px">' + s.title + '</div><span style="display:inline-block;margin-top:4px;font-size:11px;padding:2px 8px;border-radius:20px;background:' + (catColors[s.category]||'var(--bg)') + ';color:' + (catText[s.category]||'var(--muted)') + ';border:0.5px solid var(--border)">' + s.category + '</span></div></div><div style="font-size:11px;color:var(--hint);white-space:nowrap">' + priLabel + '</div></div><div style="font-size:13px;color:var(--muted);line-height:1.7;margin-bottom:10px">' + s.detail + '</div><div style="font-size:12px"><span style="color:var(--muted)">行動：</span><span style="font-weight:500">' + s.action + '</span></div></div>';
  }).join('');
}

function renderProjects() {
  var projects = D.projects || [];
  if (!projects.length) { document.getElementById('proj-cards').innerHTML = '<div style="color:var(--muted)">載入中…</div>'; return; }
  document.getElementById('proj-cards').innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px">' + projects.map(function(p) {
    var eff = p.aiOverride || p.indicator || 'on';
    var prog = Number(p.progress) || 0;
    var pc = prog < 30 ? 'err' : prog < 70 ? 'warn' : 'ok';
    var bc = eff === 'behind' ? 'var(--err-b)' : eff === 'ahead' ? 'var(--info-b)' : 'var(--border)';
    return '<div style="background:var(--card);border:0.5px solid ' + bc + ';border-radius:var(--r);padding:16px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-weight:500">' + p.name + '</span>' + ind(eff) + '</div><div style="font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px">' + (p.summary||'') + '</div><div style="display:flex;align-items:center;gap:6px"><div class="prog-wrap"><div class="prog-fill ' + pc + '" style="width:' + prog + '%"></div></div><span style="font-size:12px;color:var(--muted)">' + prog + '%</span></div></div>';
  }).join('') + '</div>';
}

function renderBD() {
  var bd = D.bd || {};
  document.getElementById('bd-ai').textContent = bd.ai || '載入中…';
  renderBDList('bd-icp1-list', bd.icp1 || []);
  renderBDList('bd-icp2-list', bd.icp2 || []);
  var det = bd.detected || [];
  document.getElementById('bd-detected-list').innerHTML = det.length ? det.map(function(d) {
    return '<div style="padding:10px 0;border-bottom:0.5px solid var(--border);font-size:13px"><div style="font-weight:500;margin-bottom:4px">' + d.member + ' <span class="badge badge-info">' + d.icp + '</span></div><div style="color:var(--muted)">' + d.mention + '</div></div>';
  }).join('') : '<div style="font-size:13px;color:var(--muted)">本週無偵測</div>';
}

function renderBDList(elId, list) {
  var el = document.getElementById(elId);
  if (!list.length) { el.innerHTML = '<div style="font-size:13px;color:var(--muted);padding:12px 0">尚無資料</div>'; return; }
  el.innerHTML = list.map(function(c) {
    return '<div style="background:var(--card);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 16px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span style="font-weight:500">' + c.company + '</span><span class="badge ' + (c.badge||'badge-info') + '">' + (c.badgeText||'') + '</span></div><div style="font-size:13px;color:var(--muted)">' + (c.detail||'') + '</div></div>';
  }).join('');
}

function setBDTab(tab) {
  curBDTab = tab;
  ['icp1','icp2','detected'].forEach(function(t) {
    document.getElementById('bd-' + t + '-panel').style.display = t === tab ? 'block' : 'none';
    document.getElementById('bdtab-' + t).classList.toggle('active', t === tab);
  });
}

function renderRaw() {
  allRaw = D.rawReports || [];
  filterRaw();
}

function filterRaw() {
  var q = (document.getElementById('raw-search').value || '').toLowerCase();
  var reports = allRaw.filter(function(r) { return !q || (r.member||'').toLowerCase().indexOf(q) >= 0 || (r.content||'').toLowerCase().indexOf(q) >= 0; });
  var el = document.getElementById('raw-list');
  if (!reports.length) { el.innerHTML = '<div style="font-size:13px;color:var(--muted)">無符合的週報</div>'; return; }
  el.innerHTML = reports.map(function(r, i) {
    return '<div class="raw-card"><div class="raw-header" onclick="document.getElementById(\'rb' + i + '\').classList.toggle(\'open\')"><div style="display:flex;align-items:center;gap:10px"><div style="width:30px;height:30px;border-radius:50%;background:var(--info-bg);color:var(--info-t);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500">' + (r.member||'?').charAt(0) + '</div><div><div style="font-weight:500">' + (r.member||'') + '</div><div style="font-size:12px;color:var(--muted)">' + (r.project||'') + ' · ' + (r.at||r.submittedAt||'') + '</div></div></div><span style="font-size:12px;color:var(--muted)">展開↓</span></div><div class="raw-body" id="rb' + i + '">' + (r.content||'').replace(/</g,'&lt;') + '</div></div>';
  }).join('');
}

// ── 載入資料 ──
fetch(SCRIPT_URL + '?action=all')
  .then(function(r) { return r.json(); })
  .then(function(data) {
    console.log('[Dashboard] 資料載入成功', Object.keys(data));
    D.overview    = data.overview    || {};
    D.projects    = data.projects    || [];
    D.suggestions = data.suggestions || {};
    D.bd          = data.bd          || {};
    D.rawReports  = data.rawReports  || [];
    if (data.suggestions && data.suggestions.weeks && data.suggestions.weeks.length) {
      curSugWeek = data.suggestions.weeks[0];
    }
    renderOverview();
  })
  .catch(function(e) {
    console.error('[Dashboard] 載入失敗', e);
    document.getElementById('ov-ai-summary').textContent = '資料載入失敗：' + e.message;
  });
</script>
</body>
</html>
